{% extends 'base.html' %}
{% block content %}
<h2>Claims</h2>
<ul class="list-group">
  {% for c in claims %}
    <li class="list-group-item">{{ c.claimant.username }} claimed {{ c.content_type }} #{{ c.object_id }} - {{ c.status }}</li>
  {% empty %}
    <li>No claims yet.</li>
  {% endfor %}
</ul>
{% endblock %}
