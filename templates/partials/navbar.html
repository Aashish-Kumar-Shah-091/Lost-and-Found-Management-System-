{% load static %}
<nav class="glass fixed top-0 left-0 right-0 z-50" x-data="{ open: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-2">
                <a href="{% url 'home' %}" class="flex items-center space-x-2">
                    <img src="{% static 'modern/img/logo.png' %}" alt="Lost & Found" class="h-10 w-auto rounded-lg">
                    <span class="text-lg font-bold text-black">Lost & Found</span>
                </a>
            </div>

            <div class="hidden md:flex items-center space-x-1">
                <a href="{% url 'home' %}" class="px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-all duration-300">Home</a>
                <a href="{% url 'lost_item_list' %}" class="px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-all duration-300">Lost Items</a>
                <a href="{% url 'found_item_list' %}" class="px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-all duration-300">Found Items</a>
                <a href="{% url 'claim_list' %}" class="px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-all duration-300">Claims</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-all duration-300">Dashboard</a>
                    <div class="relative ml-2" x-data="{ dropdown: false }">
                        <button @click="dropdown = !dropdown" class="flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition-all duration-300">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-xs font-bold text-white">
                                {{ user.username|make_list|first|upper }}
                            </div>
                            <span class="text-sm text-black">{{ user.username }}</span>
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <div x-show="dropdown" @click.away="dropdown = false"
                             x-transition:enter="transition ease-out duration-200"
                             x-transition:enter-start="opacity-0 scale-95"
                             x-transition:enter-end="opacity-100 scale-100"
                             x-transition:leave="transition ease-in duration-150"
                             x-transition:leave-start="opacity-100 scale-100"
                             x-transition:leave-end="opacity-0 scale-95"
                             class="absolute right-0 mt-2 w-48 bg-white rounded-xl py-2 shadow-2xl border border-gray-100">
                            <a href="{% url 'profile' %}" class="flex items-center px-4 py-2 text-sm text-black hover:text-black hover:bg-gray-50 transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                Profile
                            </a>
                            <a href="{% url 'dashboard' %}" class="flex items-center px-4 py-2 text-sm text-black hover:text-black hover:bg-gray-50 transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                                Dashboard
                            </a>
                            <hr class="border-gray-100 my-1">
                            <a href="{% url 'logout' %}" class="flex items-center px-4 py-2 text-sm text-red-500 hover:text-red-600 hover:bg-red-50 transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                                Logout
                            </a>
                        </div>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-all duration-300">Login</a>
                    <a href="{% url 'register' %}" class="btn-primary px-5 py-2 rounded-lg text-sm font-medium text-white ml-2">Sign Up</a>
                {% endif %}
            </div>

            <button @click="open = !open" class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    <path x-show="open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <div x-show="open" x-transition class="md:hidden glass border-t border-gray-200">
        <div class="px-4 py-3 space-y-1">
            <a href="{% url 'home' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Home</a>
            <a href="{% url 'lost_item_list' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Lost Items</a>
            <a href="{% url 'found_item_list' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Found Items</a>
            <a href="{% url 'claim_list' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Claims</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Dashboard</a>
                <a href="{% url 'profile' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Profile</a>
                <a href="{% url 'logout' %}" class="block px-4 py-2 rounded-lg text-sm text-red-500 hover:text-red-600 hover:bg-red-50 transition-colors">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="block px-4 py-2 rounded-lg text-sm text-black hover:text-black hover:bg-gray-100 transition-colors">Login</a>
                <a href="{% url 'register' %}" class="block px-4 py-2 rounded-lg text-sm font-medium text-white btn-primary text-center mt-2">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
