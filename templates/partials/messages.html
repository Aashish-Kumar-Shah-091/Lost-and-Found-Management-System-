{% if messages %}
<div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="opacity-100 transform translate-y-0"
     x-transition:leave-end="opacity-0 transform -translate-y-4"
     class="fixed top-20 right-4 z-[60] space-y-2 max-w-sm w-full">
    {% for message in messages %}
    <div class="bg-white rounded-xl px-5 py-4 flex items-center space-x-3 shadow-lg border
                {% if message.tags == 'success' %}border-l-4 border-l-emerald-500 border-emerald-100{% endif %}
                {% if message.tags == 'error' %}border-l-4 border-l-red-500 border-red-100{% endif %}
                {% if message.tags == 'warning' %}border-l-4 border-l-yellow-500 border-yellow-100{% endif %}
                {% if message.tags == 'info' %}border-l-4 border-l-cyan-500 border-cyan-100{% endif %}">
        {% if message.tags == 'success' %}
            <svg class="w-5 h-5 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        {% elif message.tags == 'error' %}
            <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        {% elif message.tags == 'warning' %}
            <svg class="w-5 h-5 text-yellow-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
        {% else %}
            <svg class="w-5 h-5 text-cyan-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        {% endif %}
        <p class="text-sm text-gray-800">{{ message }}</p>
        <button @click="show = false" class="ml-auto text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
