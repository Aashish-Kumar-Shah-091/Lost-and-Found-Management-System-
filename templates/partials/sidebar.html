<aside class="hidden lg:flex lg:flex-col w-64 glass-card rounded-2xl p-4 h-fit sticky top-20">
    <div class="flex items-center space-x-3 px-3 py-4 mb-4 border-b border-dark-600">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-sm font-bold">
            {{ user.username|make_list|first|upper }}
        </div>
        <div>
            <p class="text-sm font-medium text-white">{{ user.username }}</p>
            <p class="text-xs text-muted">{{ user.email }}</p>
        </div>
    </div>

    <nav class="space-y-1">
        <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm {% if request.resolver_match.url_name == 'dashboard' %}bg-primary/10 text-primary{% else %}text-muted hover:text-white hover:bg-dark-700{% endif %} transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'lost_item_list' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm {% if request.resolver_match.url_name == 'lost_item_list' %}bg-primary/10 text-primary{% else %}text-muted hover:text-white hover:bg-dark-700{% endif %} transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span>Lost Items</span>
        </a>
        <a href="{% url 'found_item_list' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm {% if request.resolver_match.url_name == 'found_item_list' %}bg-primary/10 text-primary{% else %}text-muted hover:text-white hover:bg-dark-700{% endif %} transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>Found Items</span>
        </a>
        <a href="{% url 'create_lost_item' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-muted hover:text-white hover:bg-dark-700 transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>Create Report</span>
        </a>
        <a href="{% url 'claim_list' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-muted hover:text-white hover:bg-dark-700 transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span>Claims</span>
        </a>
        <a href="{% url 'profile' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm {% if request.resolver_match.url_name == 'profile' %}bg-primary/10 text-primary{% else %}text-muted hover:text-white hover:bg-dark-700{% endif %} transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>Profile</span>
        </a>

        <hr class="border-dark-600 my-3">

        <a href="{% url 'logout' %}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-red-400 hover:text-red-300 hover:bg-dark-700 transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span>Logout</span>
        </a>
    </nav>
</aside>
