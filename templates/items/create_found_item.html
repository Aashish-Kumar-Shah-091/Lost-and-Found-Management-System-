{% extends 'base.html' %}
{% block content %}
<h2>Create Found Item</h2>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  <div class="mb-3"><label>Item name</label><input name="item_name" class="form-control"/></div>
  <div class="mb-3"><label>Category</label><input name="category" class="form-control"/></div>
  <div class="mb-3"><label>Description</label><textarea name="description" class="form-control"></textarea></div>
  <div class="mb-3"><label>Found location</label><input name="found_location" class="form-control"/></div>
  <div class="mb-3"><label>Found date</label><input type="date" name="found_date" class="form-control"/></div>
  <div class="mb-3"><label>Image</label><input type="file" name="image" class="form-control"/></div>
  <button class="btn btn-primary" type="submit">Create</button>
</form>
{% endblock %}
