{% extends 'base.html' %}
{% block content %}
<h2>Found Items</h2>
<a class="btn btn-primary mb-3" href="{% url 'create_found_item' %}">Report Found Item</a>
<ul class="list-group">
  {% for item in items %}
    <li class="list-group-item">
      <a href="{% url 'found_item_detail' item.id %}">{{ item.item_name }}</a>
      <small class="text-muted">by {{ item.user.username }} on {{ item.created_at }}</small>
    </li>
  {% empty %}
    <li>No found items yet.</li>
  {% endfor %}
</ul>
{% endblock %}
