{% extends 'base.html' %}

{% block title %}Page Not Found — Lost & Found{% endblock %}

{% block content %}
<div class="pt-20 min-h-screen flex items-center justify-center">
    <div class="text-center px-4">
        <h1 class="text-8xl font-bold gradient-text mb-4">404</h1>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Page Not Found</h2>
        <p class="text-gray-500 text-sm mb-8 max-w-md mx-auto">The page you're looking for doesn't exist or has been moved.</p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="{% url 'home' %}" class="btn-primary px-6 py-3 rounded-xl text-sm font-medium">Go Home</a>
            <a href="{% url 'lost_item_list' %}" class="btn-secondary px-6 py-3 rounded-xl text-sm font-medium">Browse Items</a>
        </div>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
