{% extends 'base.html' %}

{% block title %}Report Found Item — Lost & Found{% endblock %}

{% block content %}
<div class="pt-20 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Report Found Item</h1>
            <p class="text-black text-sm mt-2">Help reunite this item with its owner</p>
        </div>

        <!-- Form -->
        <div class="glass-card rounded-2xl p-8">
            <form method="POST" enctype="multipart/form-data" class="space-y-6" x-data="{ preview: null }">
                {% csrf_token %}

                <div>
                    <label for="item_name" class="block text-sm font-medium text-black mb-2">Item Name</label>
                    <input type="text" name="item_name" id="item_name" required
                           class="input-dark w-full px-4 py-3 rounded-xl text-gray-900 text-sm placeholder-dark-600"
                           placeholder="e.g., Blue Backpack">
                </div>

                <div>
                    <label for="category" class="block text-sm font-medium text-black mb-2">Category</label>
                    <select name="category" id="category" required class="input-dark w-full px-4 py-3 rounded-xl text-gray-900 text-sm appearance-none cursor-pointer">
                        <option value="" class="bg-dark-800">Select a category</option>
                        <option value="Electronics" class="bg-dark-800">Electronics</option>
                        <option value="Documents" class="bg-dark-800">Documents</option>
                        <option value="Accessories" class="bg-dark-800">Accessories</option>
                        <option value="Bags" class="bg-dark-800">Bags</option>
                        <option value="Others" class="bg-dark-800">Others</option>
                    </select>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-black mb-2">Description</label>
                    <textarea name="description" id="description" rows="4" required
                              class="input-dark w-full px-4 py-3 rounded-xl text-gray-900 text-sm placeholder-dark-600 resize-none"
                              placeholder="Describe the item in detail (color, brand, condition...)"></textarea>
                </div>

                <div>
                    <label for="found_location" class="block text-sm font-medium text-black mb-2">Location Found</label>
                    <input type="text" name="found_location" id="found_location" required
                           class="input-dark w-full px-4 py-3 rounded-xl text-gray-900 text-sm placeholder-dark-600"
                           placeholder="e.g., Library, 2nd floor">
                </div>

                <div>
                    <label for="found_date" class="block text-sm font-medium text-black mb-2">Date Found</label>
                    <input type="date" name="found_date" id="found_date" required
                           class="input-dark w-full px-4 py-3 rounded-xl text-gray-900 text-sm">
                </div>

                <!-- Image Upload -->
                <div>
                    <label class="block text-sm font-medium text-black mb-2">Image (optional)</label>
                    <div class="border-2 border-dashed border-dark-600 rounded-xl p-6 text-center hover:border-primary/50 transition-colors cursor-pointer relative"
                         @click="$refs.fileInput.click()"
                         @dragover.prevent="$el.classList.add('border-primary')"
                         @dragleave.prevent="$el.classList.remove('border-primary')"
                         @drop.prevent="$el.classList.remove('border-primary'); $refs.fileInput.files = $event.dataTransfer.files; preview = URL.createObjectURL($event.dataTransfer.files[0])">
                        <input type="file" name="image" accept="image/*" class="hidden" x-ref="fileInput"
                               @change="preview = URL.createObjectURL($event.target.files[0])">
                        <div x-show="!preview">
                            <svg class="w-10 h-10 mx-auto text-dark-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <p class="text-sm text-black">Drag & drop an image or <span class="text-primary">click to browse</span></p>
                            <p class="text-xs text-dark-600 mt-1">PNG, JPG up to 5MB</p>
                        </div>
                        <div x-show="preview" class="relative">
                            <img :src="preview" class="max-h-48 mx-auto rounded-lg">
                            <button type="button" @click.stop="preview = null; $refs.fileInput.value = ''"
                                    class="absolute top-2 right-2 w-6 h-6 bg-red-500 rounded-full flex items-center justify-center">
                                <svg class="w-3 h-3 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 pt-2">
                    <a href="{% url 'found_item_list' %}" class="btn-secondary flex-1 py-3 rounded-xl text-sm font-medium text-gray-900 text-center">Cancel</a>
                    <button type="submit" class="btn-primary flex-1 py-3 rounded-xl text-sm font-medium text-gray-900">Submit Report</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
