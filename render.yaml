databases:
  - name: lostfound-db
    plan: free
    databaseName: lostfound
    user: lostfound

services:
  - type: web
    name: lostfound
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn lostFound.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lostfound-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.10"
